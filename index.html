<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Scanlation GitHub Page" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dummy Scans</title>

    <!-- External CSS Files -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/icomoon/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item" href="#">
            <strong>Dummy Scans</strong>
          </a>
          <a
            role="button"
            class="navbar-burger"
            aria-label="menu"
            aria-expanded="false"
            data-target="navbarMenu"
          >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </a>
        </div>

        <div id="navbarMenu" class="navbar-menu">
          <div class="navbar-end">
            <a class="navbar-item" href="#about">About</a>
            <a class="navbar-item" href="#projects">Projects</a>
            <a class="navbar-item" href="#news">News</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="section has-text-centered" id="about">
      <div class="container">
        <h1 class="title">Welcome to the Scanlation Team!</h1>
        <p class="subtitle">
          We translate and share your favorite manga for free.
        </p>
        <div class="buttons is-centered is-flex-wrap-wrap mt-4">
          <a
            href="https://mangadex.org/"
            class="button is-warning"
            target="_blank"
          >
            <i class="icon-mangadex-brands-simple mr-2"></i> Follow on MangaDex
          </a>
          <a href="https://discord.gg/" class="button is-link" target="_blank">
            <i class="bi bi-discord mr-2"></i> Join Our Discord
          </a>
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section class="section" id="projects">
      <div class="container">
        <h2 class="title is-3">Our Projects</h2>
        <div class="columns is-multiline" id="project-list">
          <p>Loading project list...</p>
        </div>
      </div>
    </section>

    <!-- News Section -->
    <section class="section" id="news">
      <div class="container">
        <h2 class="title is-3">Announcement</h2>
        <div class="columns is-multiline" id="news-container">
          <p>Loading news...</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer has-text-centered">
      <div class="content">
        <p>
          Made with 🥖 by wb.
        </p>
      </div>
    </footer>

    <!-- External JavaScript File -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
